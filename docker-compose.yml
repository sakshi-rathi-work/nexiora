version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexiora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexiora
      POSTGRES_PASSWORD: nexiora_local_pw
      POSTGRES_DB: nexiora_dev
    ports:
      - '5432:5432'
    volumes:
      - nexiora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexiora -d nexiora_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nexiora_postgres_data:
